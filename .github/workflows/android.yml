name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # UI source must be tested exactly as committed. Do not mutate MainActivity during CI.

      - name: Run Android host regression checks
        run: |
          sh ./tools/check-v1-source.sh
          sh ./tools/run-storage-recovery-tests.sh
          sh ./tools/run-updater-picker-routing-tests.sh

      - name: Run repository-level Node tests
        working-directory: ${{ github.workspace }}
        run: npm test

      - name: Build and verify debug variants
        if: github.event_name == 'pull_request'
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadDebug
          assemblePlayDebug
          lintGithubSideloadDebug
          lintPlayDebug
          lintGithubSideloadRelease
          testGithubSideloadDebugUnitTest
          testGithubSideloadReleaseUnitTest
          testPlayDebugUnitTest
          compileGithubSideloadDebugAndroidTestJavaWithJavac
          compilePlayDebugAndroidTestJavaWithJavac

      - name: Print lint reports on PR build failure
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        run: |
          find app/build -type f \( -name 'lint-results*.txt' -o -name 'lint-report*.txt' \) -print -exec cat {} \; || true

      - name: Enable KVM acceleration and install emulator runtime libraries
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # ubuntu-24.04 runners do not ship libpulse.so.0, which qemu-system-x86_64 (bundled with the Android emulator) links against.
          sudo apt-get install -y libpulse0 || { sudo apt-get update && sudo apt-get install -y libpulse0; }

      - name: Provision Android 16 (API 36) emulator image
        if: github.event_name == 'pull_request'
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_USER_HOME="${ANDROID_USER_HOME:-$HOME/.android}"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$ANDROID_USER_HOME/avd}"
          trace="$RUNNER_TEMP/provision36-trace.log"
          : > "$trace"
          exec >> "$trace" 2>&1
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" | head -n 30
          cd "${{ github.workspace }}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$sdkmanager" || { echo "::error::sdkmanager not found at $sdkmanager"; exit 1; }
          if ! yes 2>/dev/null | "$sdkmanager" --licenses >/dev/null; then
            echo "::warning::sdkmanager --licenses exited nonzero (expected: 'yes' gets SIGPIPE under pipefail); continuing, install step surfaces real license problems"
          fi
          "$sdkmanager" --install "platforms;android-36" "system-images;android-36;google_apis;x86_64" "emulator" "platform-tools" >/dev/null
          echo "no" | "$avdmanager" create avd -n ci36 -k "system-images;android-36;google_apis;x86_64" -d pixel_2 --force >/dev/null
          ls -l "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -version
          ls -l /dev/kvm || true

      - name: Cold-launch published v1.3 APK and current debug APK on Android 16
        if: github.event_name == 'pull_request'
        id: api36
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_USER_HOME="${ANDROID_USER_HOME:-$HOME/.android}"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$ANDROID_USER_HOME/avd}"
          trace="$RUNNER_TEMP/api36-trace.log"
          : > "$trace"
          exec >> "$trace" 2>&1
          set -x
          cd "${{ github.workspace }}"
          fail() { echo "::error::API-36 gate: $1"; exit 1; }
          adb="$ANDROID_HOME/platform-tools/adb"
          test -x "$adb" || fail "adb not found: $adb"
          echo "--- /dev/kvm:"; ls -l /dev/kvm || true
          echo "--- starting emulator (log: $RUNNER_TEMP/emulator36.log)"
          "$ANDROID_HOME/emulator/emulator" -avd ci36 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics > "$RUNNER_TEMP/emulator36.log" 2>&1 &
          emu_pid=$!
          timeout 300s "$adb" wait-for-device || { echo "ADB WAIT-FOR-DEVICE FAILED/TIMEOUT"; tail -n 80 "$RUNNER_TEMP/emulator36.log"; "$adb" devices; fail "adb wait-for-device timed out or failed"; }
          boot=""
          for i in $(seq 1 200); do
            boot="$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot" = "1" ]; then echo "BOOT COMPLETED (poll $i)"; break; fi
            if ! kill -0 "$emu_pid" 2>/dev/null; then echo "EMULATOR PROCESS DIED (poll $i)"; tail -n 80 "$RUNNER_TEMP/emulator36.log"; fail "emulator process exited during boot"; fi
            sleep 5
          done
          [ "$boot" = "1" ] || { echo "BOOT TIMEOUT"; tail -n 80 "$RUNNER_TEMP/emulator36.log"; "$adb" devices; fail "emulator failed to boot in 1000s"; }
          "$adb" devices
          release_apk="$RUNNER_TEMP/Daymark-v1.3-githubSideload.apk"
          debug_apk="android-app/app/build/outputs/apk/githubSideload/debug/app-githubSideload-debug.apk"
          test -s "$debug_apk" || fail "debug APK missing: $debug_apk"
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 60 "https://github.com/AbrarulHaque8541/daymark/releases/download/v1.3/Daymark-v1.3-githubSideload.apk" --output "$release_apk" || fail "curl of published v1.3 APK failed"
          echo "aa69ab6f81cae22a2c0ea58ca0619682dd77da826c5d5faaefe0eb934115e585  $release_apk" | sha256sum --check || fail "published v1.3 APK SHA-256 mismatch"
          unzip -tqq "$release_apk" || fail "published v1.3 APK is not a valid zip"
          unzip -Z1 "$release_apk" | grep -Fxq "AndroidManifest.xml" || fail "published v1.3 APK missing AndroidManifest.xml"
          unzip -Z1 "$release_apk" | grep -Fxq "resources.arsc" || fail "published v1.3 APK missing resources.arsc"
          unzip -Z1 "$release_apk" | grep -Fxq "classes.dex" || fail "published v1.3 APK missing classes.dex"
          PATH="$ANDROID_HOME/platform-tools:$PATH" bash android-app/tools/cold-launch-apk.sh "published v1.3 signed APK on API 36" "$release_apk" || fail "cold-launch of published v1.3 on API 36 failed"
          PATH="$ANDROID_HOME/platform-tools:$PATH" timeout 30s "$adb" uninstall com.abrar.daymark || fail "adb uninstall of com.abrar.daymark failed"
          PATH="$ANDROID_HOME/platform-tools:$PATH" bash android-app/tools/cold-launch-apk.sh "current PR debug APK on API 36" "$debug_apk" || fail "cold-launch of current PR debug APK on API 36 failed"
          kill "$emu_pid" 2>/dev/null || true
          echo "API36 GATE: ALL PASS"

      - name: Provision Android 10 (API 29) emulator image
        if: github.event_name == 'pull_request'
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_USER_HOME="${ANDROID_USER_HOME:-$HOME/.android}"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$ANDROID_USER_HOME/avd}"
          trace="$RUNNER_TEMP/provision29-trace.log"
          : > "$trace"
          exec >> "$trace" 2>&1
          set -x
          cd "${{ github.workspace }}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if ! yes 2>/dev/null | "$sdkmanager" --licenses >/dev/null; then
            echo "::warning::sdkmanager --licenses exited nonzero (expected: 'yes' gets SIGPIPE under pipefail); continuing, install step surfaces real license problems"
          fi
          "$sdkmanager" --install "system-images;android-29;google_apis;x86_64" "emulator" "platform-tools" >/dev/null
          echo "no" | "$avdmanager" create avd -n ci29 -k "system-images;android-29;google_apis;x86_64" -d pixel_2 --force >/dev/null
          ls -l "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -list-avds

      - name: Cold-launch current debug APK on Android 10 (API 29)
        if: github.event_name == 'pull_request'
        id: api29
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_USER_HOME="${ANDROID_USER_HOME:-$HOME/.android}"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$ANDROID_USER_HOME/avd}"
          trace="$RUNNER_TEMP/api29-trace.log"
          : > "$trace"
          exec >> "$trace" 2>&1
          set -x
          cd "${{ github.workspace }}"
          fail() { echo "::error::API-29 gate: $1"; exit 1; }
          adb="$ANDROID_HOME/platform-tools/adb"
          echo "--- starting emulator (log: $RUNNER_TEMP/emulator29.log)"
          "$ANDROID_HOME/emulator/emulator" -avd ci29 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics > "$RUNNER_TEMP/emulator29.log" 2>&1 &
          emu_pid=$!
          timeout 300s "$adb" wait-for-device || { echo "ADB WAIT-FOR-DEVICE FAILED/TIMEOUT"; tail -n 80 "$RUNNER_TEMP/emulator29.log"; "$adb" devices; fail "adb wait-for-device timed out or failed"; }
          boot=""
          for i in $(seq 1 200); do
            boot="$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot" = "1" ]; then echo "BOOT COMPLETED (poll $i)"; break; fi
            if ! kill -0 "$emu_pid" 2>/dev/null; then echo "EMULATOR PROCESS DIED (poll $i)"; tail -n 80 "$RUNNER_TEMP/emulator29.log"; fail "emulator process exited during boot"; fi
            sleep 5
          done
          [ "$boot" = "1" ] || { echo "BOOT TIMEOUT"; tail -n 80 "$RUNNER_TEMP/emulator29.log"; "$adb" devices; fail "emulator failed to boot in 1000s"; }
          debug_apk="android-app/app/build/outputs/apk/githubSideload/debug/app-githubSideload-debug.apk"
          test -s "$debug_apk" || fail "debug APK missing: $debug_apk"
          PATH="$ANDROID_HOME/platform-tools:$PATH" bash android-app/tools/cold-launch-apk.sh "current PR debug APK on API 29" "$debug_apk" || fail "cold-launch of current PR debug APK on API 29 failed"
          kill "$emu_pid" 2>/dev/null || true
          echo "API29 GATE: ALL PASS"

      - name: Report emulator gate traces to the pull request
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          API36_OUTCOME: ${{ steps.api36.outcome }}
          API29_OUTCOME: ${{ steps.api29.outcome }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/emulator-trace-comment.md"
          {
            echo "## Emulator gate trace (temporary CI diagnostics)"
            echo
            echo "- API-36 gate outcome: ${API36_OUTCOME:-unknown}"
            echo "- API-29 gate outcome: ${API29_OUTCOME:-unknown}"
            echo
            for f in "$RUNNER_TEMP/provision36-trace.log" "$RUNNER_TEMP/api36-trace.log" "$RUNNER_TEMP/emulator36.log" "$RUNNER_TEMP/provision29-trace.log" "$RUNNER_TEMP/api29-trace.log" "$RUNNER_TEMP/emulator29.log"; do
              echo "### $(basename "$f")"
              echo
              echo '<details><summary>trace</summary>'
              echo
              echo '```'
              if [ -s "$f" ]; then tail -c 12000 "$f"; else echo "(no trace output)"; fi
              echo '```'
              echo
              echo '</details>'
              echo
            done
            echo "Temporary diagnostics posted by CI; removed after root-cause fix."
          } > "$body"
          gh pr comment "$PR_NUMBER" --body-file "$body"

      - name: Validate production signing secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("KEY_ALIAS")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required production signing secret(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Restore production keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daymark-release.keystore"
          test -s "$RUNNER_TEMP/daymark-release.keystore"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/daymark-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadRelease
          bundleGithubSideloadRelease
          lintGithubSideloadRelease
          testGithubSideloadReleaseUnitTest
