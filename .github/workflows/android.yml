name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android host regression checks
        run: |
          sh ./tools/check-v1-source.sh
          sh ./tools/run-storage-recovery-tests.sh
          sh ./tools/run-updater-picker-routing-tests.sh

      - name: Build and verify debug variants
        if: github.event_name == 'pull_request'
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadDebug
          assemblePlayDebug
          lintGithubSideloadDebug
          lintPlayDebug
          testGithubSideloadDebugUnitTest
          testPlayDebugUnitTest
          compileGithubSideloadDebugAndroidTestJavaWithJavac
          compilePlayDebugAndroidTestJavaWithJavac

      - name: Validate production signing secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("KEY_ALIAS")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required production signing secret(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Restore production keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daymark-release.keystore"
          test -s "$RUNNER_TEMP/daymark-release.keystore"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/daymark-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadRelease
          bundleGithubSideloadRelease
          lintGithubSideloadRelease
          testGithubSideloadReleaseUnitTest

      - name: Prepare canonical release artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/githubSideload/release/app-githubSideload-release.apk"
          aab="app/build/outputs/bundle/githubSideloadRelease/app-githubSideload-release.aab"
          test -s "$apk"
          test -s "$aab"
          mkdir -p release-artifacts
          cp "$apk" release-artifacts/app-release.apk
          cp "$aab" release-artifacts/app-release.aab
          sha256sum release-artifacts/app-release.apk release-artifacts/app-release.aab | tee release-artifacts/SHA256SUMS.txt

      - name: Upload release APK and AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: daymark-release-${{ github.sha }}
          path: |
            android-app/release-artifacts/app-release.apk
            android-app/release-artifacts/app-release.aab
            android-app/release-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Verify release artifact metadata
        if: github.event_name != 'pull_request'
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose release-artifacts/app-release.apk
          "$aapt" dump badging release-artifacts/app-release.apk | grep -F "package: name='com.cue.daymark'"
          # Version is defined in build.gradle.kts — do not hardcode 1.0.1
          "$aapt" dump badging release-artifacts/app-release.apk | grep -E "versionName='[^']+'"
          test "$(stat -c '%s' release-artifacts/app-release.apk)" -gt 0
          test "$(stat -c '%s' release-artifacts/app-release.aab)" -gt 0

      - name: Remove decoded production keystore
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: rm -f "$RUNNER_TEMP/daymark-release.keystore"

  web:
    name: Web prototype tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run web prototype tests
        run: npm test
