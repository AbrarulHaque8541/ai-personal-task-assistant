name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # UI source must be tested exactly as committed. Do not mutate MainActivity during CI.

      - name: Run Android host regression checks
        run: |
          sh ./tools/check-v1-source.sh
          sh ./tools/run-storage-recovery-tests.sh
          sh ./tools/run-updater-picker-routing-tests.sh

      - name: Run repository-level Node tests
        working-directory: ${{ github.workspace }}
        run: npm test

      - name: Build and verify debug variants
        if: github.event_name == 'pull_request'
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadDebug
          assemblePlayDebug
          lintGithubSideloadDebug
          lintPlayDebug
          lintGithubSideloadRelease
          testGithubSideloadDebugUnitTest
          testGithubSideloadReleaseUnitTest
          testPlayDebugUnitTest
          compileGithubSideloadDebugAndroidTestJavaWithJavac
          compilePlayDebugAndroidTestJavaWithJavac

      - name: Print lint reports on PR build failure
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        run: |
          find app/build -type f \( -name 'lint-results*.txt' -o -name 'lint-report*.txt' \) -print -exec cat {} \; || true

      - name: Enable KVM acceleration for emulator cold-launch gates
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cold-launch published v1.3 APK and current debug APK on Android 16
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            cd "${{ github.workspace }}"
            release_apk="$RUNNER_TEMP/Daymark-v1.3-githubSideload.apk"
            debug_apk="android-app/app/build/outputs/apk/githubSideload/debug/app-githubSideload-debug.apk"
            test -s "$debug_apk"
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 60 "https://github.com/AbrarulHaque8541/daymark/releases/download/v1.3/Daymark-v1.3-githubSideload.apk" --output "$release_apk"
            echo "aa69ab6f81cae22a2c0ea58ca0619682dd77da826c5d5faaefe0eb934115e585  $release_apk" | sha256sum --check
            unzip -tqq "$release_apk"
            unzip -Z1 "$release_apk" | grep -Fxq "AndroidManifest.xml"
            unzip -Z1 "$release_apk" | grep -Fxq "resources.arsc"
            unzip -Z1 "$release_apk" | grep -Fxq "classes.dex"
            bash android-app/tools/cold-launch-apk.sh "published v1.3 signed APK on API 36" "$release_apk"
            timeout 30s adb uninstall com.abrar.daymark
            bash android-app/tools/cold-launch-apk.sh "current PR debug APK on API 36" "$debug_apk"

      - name: Cold-launch current debug APK on Android 10 (API 29)
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            cd "${{ github.workspace }}"
            debug_apk="android-app/app/build/outputs/apk/githubSideload/debug/app-githubSideload-debug.apk"
            test -s "$debug_apk"
            bash android-app/tools/cold-launch-apk.sh "current PR debug APK on API 29" "$debug_apk"

      - name: Validate production signing secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("KEY_ALIAS")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required production signing secret(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Restore production keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daymark-release.keystore"
          test -s "$RUNNER_TEMP/daymark-release.keystore"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/daymark-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadRelease
          bundleGithubSideloadRelease
          lintGithubSideloadRelease
          testGithubSideloadReleaseUnitTest
