name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply home/browser redesign (UX)
        run: python3 ./tools/apply-home-browser-redesign.py .

      - name: Run Android host regression checks
        run: |
          sh ./tools/check-v1-source.sh
          sh ./tools/run-storage-recovery-tests.sh
          sh ./tools/run-updater-picker-routing-tests.sh

      - name: Build and verify debug variants
        if: github.event_name == 'pull_request'
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadDebug
          assemblePlayDebug
          lintGithubSideloadDebug
          lintPlayDebug
          testGithubSideloadDebugUnitTest
          testPlayDebugUnitTest
          compileGithubSideloadDebugAndroidTestJavaWithJavac
          compilePlayDebugAndroidTestJavaWithJavac

      - name: Cold-launch debug APK on Android 16 emulator
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            apk="android-app/app/build/outputs/apk/githubSideload/debug/app-githubSideload-debug.apk"
            test -s "$apk"
            apk_bytes="$(stat -c%s "$apk")"
            [[ "$apk_bytes" -ge 100000 ]] || { echo "APK suspiciously small: $apk_bytes bytes"; exit 1; }
            unzip -tqq "$apk"
            unzip -Z1 "$apk" | grep -Fxq "AndroidManifest.xml"
            unzip -Z1 "$apk" | grep -Fxq "classes.dex"
            adb install -r "$apk"
            adb logcat -c
            adb shell am force-stop com.abrar.daymark || true
            adb shell am start -W -n com.abrar.daymark/com.abrar.daymark.MainActivity
            sleep 8
            if [[ -z "$(adb shell pidof com.abrar.daymark | tr -d '\r')" ]]; then
              echo "::error::Daymark process exited during cold launch"
              adb logcat -d -v threadtime | tail -n 500
              exit 1
            fi
            focus="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true)"
            if ! grep -q 'com.abrar.daymark' <<< "$focus"; then
              echo "::error::Daymark MainActivity is not resumed after cold launch: $focus"
              adb logcat -d -v threadtime | tail -n 500
              exit 1
            fi
            adb shell uiautomator dump /sdcard/daymark-window.xml >/dev/null
            adb pull /sdcard/daymark-window.xml "$RUNNER_TEMP/daymark-window.xml" >/dev/null
            if grep -q 'Daymark could not finish opening' "$RUNNER_TEMP/daymark-window.xml"; then
              echo "::error::Daymark displayed its startup-failure screen"
              cat "$RUNNER_TEMP/daymark-window.xml"
              adb logcat -d -v threadtime | tail -n 500
              exit 1
            fi
            echo "PASS: debug APK cold-launched on API 36; PID remained alive and startup-failure screen was absent."

      - name: Validate production signing secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("KEY_ALIAS")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required production signing secret(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Restore production keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daymark-release.keystore"
          test -s "$RUNNER_TEMP/daymark-release.keystore"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/daymark-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadRelease
          bundleGithubSideloadRelease
          lintGithubSideloadRelease
          testGithubSideloadReleaseUnitTest
