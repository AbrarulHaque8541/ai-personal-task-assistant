name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply home/browser redesign (UX)
        run: python3 ./tools/apply-home-browser-redesign.py .

      - name: Run Android host regression checks
        run: |
          sh ./tools/check-v1-source.sh
          sh ./tools/run-storage-recovery-tests.sh
          sh ./tools/run-updater-picker-routing-tests.sh

      - name: Run repository-level Node tests
        working-directory: ${{ github.workspace }}
        run: npm test

      - name: Build and verify debug variants
        if: github.event_name == 'pull_request'
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadDebug
          assemblePlayDebug
          lintGithubSideloadDebug
          lintPlayDebug
          lintGithubSideloadRelease
          testGithubSideloadDebugUnitTest
          testGithubSideloadReleaseUnitTest
          testPlayDebugUnitTest
          compileGithubSideloadDebugAndroidTestJavaWithJavac
          compilePlayDebugAndroidTestJavaWithJavac

      - name: Print lint reports on PR build failure
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        run: |
          find app/build -type f \( -name 'lint-results*.txt' -o -name 'lint-report*.txt' \) -print -exec cat {} \; || true

      - name: Cold-launch published v1.1 APK and current debug APK on Android 16
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            debug_apk="android-app/app/build/outputs/apk/githubSideload/debug/app-githubSideload-debug.apk"
            release_apk="$RUNNER_TEMP/Daymark-v1.1-githubSideload.apk"
            test -s "$debug_apk"
            curl --fail --location --silent --show-error "https://github.com/AbrarulHaque8541/daymark/releases/download/v1.1/Daymark-v1.1-githubSideload.apk" --output "$release_apk"
            echo "d0a6556582698d2a972249f68400118777422316c3b05f38fe62a946540156ed  $release_apk" | sha256sum --check
            release_bytes="$(stat -c%s "$release_apk")"
            [[ "$release_bytes" -ge 100000 ]] || { echo "::error::Published v1.1 APK unexpectedly small: $release_bytes bytes"; exit 1; }
            unzip -tqq "$release_apk"
            unzip -Z1 "$release_apk" | grep -Fxq "AndroidManifest.xml"
            unzip -Z1 "$release_apk" | grep -Fxq "resources.arsc"
            unzip -Z1 "$release_apk" | grep -Fxq "classes.dex"
            launch_and_check() {
              local label="$1" apk="$2"
              echo "::group::Cold launch: $label"
              if ! timeout 60s adb install -r "$apk"; then adb logcat -d -v threadtime | tail -n 500; return 1; fi
              adb logcat -c
              if ! timeout 45s adb shell am start -W -n com.abrar.daymark/com.abrar.daymark.MainActivity; then adb logcat -d -v threadtime | tail -n 500; return 1; fi
              sleep 8
              if [[ -z "$(adb shell pidof com.abrar.daymark | tr -d '\r')" ]]; then
                echo "::error::$label process exited during cold launch"
                adb logcat -d -v threadtime | tail -n 500
                return 1
              fi
              focus="$(timeout 15s adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true)"
              if ! grep -q 'com.abrar.daymark' <<< "$focus"; then
                echo "::error::$label MainActivity is not resumed: $focus"
                adb logcat -d -v threadtime | tail -n 500
                return 1
              fi
              startup_failure="$(adb logcat -d -v threadtime | grep -F 'DaymarkStartup: cold start failed' || true)"
              if [[ -n "$startup_failure" ]]; then
                echo "::error::$label displayed the startup-failure screen"
                echo "$startup_failure"
                adb logcat -d -v threadtime | tail -n 500
                return 1
              fi
              crash_lines="$(adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION:|Process: com.abrar.daymark|Fatal signal' || true)"
              if [[ -n "$crash_lines" ]]; then echo "::error::$label emitted crash log entries"; echo "$crash_lines"; adb logcat -d -v threadtime | tail -n 500; return 1; fi
              echo "PASS: $label stayed alive and did not show the startup-failure screen."
              echo "::endgroup::"
            }
            launch_and_check "published v1.1 signed APK" "$release_apk"
            adb uninstall com.abrar.daymark
            launch_and_check "current PR debug APK" "$debug_apk"
            echo "PASS: exact published v1.1 APK and current debug APK cold-launched on Android 16 emulator."
      - name: Validate production signing secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("KEY_ALIAS")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required production signing secret(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Restore production keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daymark-release.keystore"
          test -s "$RUNNER_TEMP/daymark-release.keystore"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/daymark-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadRelease
          bundleGithubSideloadRelease
          lintGithubSideloadRelease
          testGithubSideloadReleaseUnitTest
