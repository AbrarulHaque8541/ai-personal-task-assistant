name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_release_build:
        description: "Build signed release APK/AAB even on a non-main ref (requires secrets)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android host regression checks
        run: |
          sh ./tools/check-v1-source.sh
          sh ./tools/run-storage-recovery-tests.sh
          sh ./tools/run-updater-picker-routing-tests.sh

      - name: Decide whether to build signed release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          build_release=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            build_release=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_release_build }}" == "true" ]]; then
            build_release=true
          fi
          echo "build_release=$build_release" >> "$GITHUB_OUTPUT"

      - name: Build and verify debug variants
        if: steps.release.outputs.build_release != 'true'
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadDebug
          assemblePlayDebug
          lintGithubSideloadDebug
          lintPlayDebug
          testGithubSideloadDebugUnitTest
          testPlayDebugUnitTest
          compileGithubSideloadDebugAndroidTestJavaWithJavac
          compilePlayDebugAndroidTestJavaWithJavac

      - name: Validate production signing secrets
        if: steps.release.outputs.build_release == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("KEY_ALIAS")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required production signing secret(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Restore production keystore
        if: steps.release.outputs.build_release == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daymark-release.keystore"
          test -s "$RUNNER_TEMP/daymark-release.keystore"

      - name: Build signed release APK and AAB (githubSideload + play)
        if: steps.release.outputs.build_release == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/daymark-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadRelease
          bundleGithubSideloadRelease
          assemblePlayRelease
          bundlePlayRelease
          lintGithubSideloadRelease
          lintPlayRelease
          testGithubSideloadReleaseUnitTest
          testPlayReleaseUnitTest

      - name: Prepare canonical release artifacts
        if: steps.release.outputs.build_release == 'true'
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk_sideload="app/build/outputs/apk/githubSideload/release/app-githubSideload-release.apk"
          aab_sideload="app/build/outputs/bundle/githubSideloadRelease/app-githubSideload-release.aab"
          apk_play="app/build/outputs/apk/play/release/app-play-release.apk"
          aab_play="app/build/outputs/bundle/playRelease/app-play-release.aab"

          for f in "$apk_sideload" "$aab_sideload" "$apk_play" "$aab_play"; do
            test -s "$f"
          done

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          version_name="$("$aapt" dump badging "$apk_sideload" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          version_code="$("$aapt" dump badging "$apk_sideload" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          [[ -n "$version_name" && -n "$version_code" ]]

          mkdir -p release-artifacts
          cp "$apk_sideload" "release-artifacts/Daymark-v${version_name}-githubSideload.apk"
          cp "$aab_sideload" "release-artifacts/Daymark-v${version_name}-githubSideload.aab"
          cp "$apk_play" "release-artifacts/Daymark-v${version_name}-play.apk"
          cp "$aab_play" "release-artifacts/Daymark-v${version_name}-play.aab"

          # Stable names expected by some consumers / docs
          cp "$apk_sideload" release-artifacts/app-release.apk
          cp "$aab_sideload" release-artifacts/app-release.aab

          (
            cd release-artifacts
            sha256sum \
              "Daymark-v${version_name}-githubSideload.apk" \
              "Daymark-v${version_name}-githubSideload.aab" \
              "Daymark-v${version_name}-play.apk" \
              "Daymark-v${version_name}-play.aab" \
              app-release.apk \
              app-release.aab \
              | tee SHA256SUMS.txt
          )

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release artifacts"
            echo
            echo "- Version: \`${version_name}\` (code \`${version_code}\`)"
            echo "- Sideload APK/AAB + Play APK/AAB prepared"
            echo "- SHA-256 checksums written to SHA256SUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK and AAB
        if: steps.release.outputs.build_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Daymark-v${{ steps.artifacts.outputs.version_name }}-release-${{ github.sha }}
          path: |
            android-app/release-artifacts/Daymark-v${{ steps.artifacts.outputs.version_name }}-githubSideload.apk
            android-app/release-artifacts/Daymark-v${{ steps.artifacts.outputs.version_name }}-githubSideload.aab
            android-app/release-artifacts/Daymark-v${{ steps.artifacts.outputs.version_name }}-play.apk
            android-app/release-artifacts/Daymark-v${{ steps.artifacts.outputs.version_name }}-play.aab
            android-app/release-artifacts/app-release.apk
            android-app/release-artifacts/app-release.aab
            android-app/release-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Verify release artifact metadata
        if: steps.release.outputs.build_release == 'true'
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          for apk in release-artifacts/app-release.apk release-artifacts/Daymark-v*-githubSideload.apk release-artifacts/Daymark-v*-play.apk; do
            "$apksigner" verify --verbose "$apk"
            "$aapt" dump badging "$apk" | grep -F "package: name='com.cue.daymark'"
            test "$(stat -c '%s' "$apk")" -gt 0
          done

          test "$(stat -c '%s' release-artifacts/app-release.aab)" -gt 0

      - name: Remove decoded production keystore
        if: always() && steps.release.outputs.build_release == 'true'
        shell: bash
        run: rm -f "$RUNNER_TEMP/daymark-release.keystore"

  web:
    name: Web prototype tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run web prototype tests
        run: npm test
