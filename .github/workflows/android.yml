name: Android CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run Android host regression checks
      run: |
        sh ./tools/check-v1-source.sh
        sh ./tools/run-storage-recovery-tests.sh
    - name: Build and verify debug variants
      run: >-
        ./gradlew assembleDebug
        lintGithubSideloadDebug
        lintPlayDebug
        testGithubSideloadDebugUnitTest
        testPlayDebugUnitTest
        compileGithubSideloadDebugAndroidTestJavaWithJavac
        compilePlayDebugAndroidTestJavaWithJavac
