name: One-shot tag v1.4

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-shot-tag-v1.4.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-tag-v1.4
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create tag v1.4 and dispatch the production release workflow
        shell: bash
        env:
          EXPECTED_MAIN: ae4b5a1409a79dac9058b73d42d09544004f2373
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN" refs/remotes/origin/main || { echo "::error::$EXPECTED_MAIN is not an ancestor of main; refusing to tag"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.4" >/dev/null 2>&1; then
            echo "tag v1.4 already exists; not recreating it"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v1.4" -f sha="$EXPECTED_MAIN"
            echo "created tag v1.4 at $EXPECTED_MAIN via the REST API"
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.4" --jq ".object.sha" 
          gh workflow run android-production-release.yml --ref v1.4
          sleep 10
          echo "--- recent android-production-release runs:"
          gh run list --workflow android-production-release.yml --limit 3 || true

      - name: Remove this one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-tag-v1.4.yml
          git commit -m "Remove one-shot v1.4 tag workflow (already applied)"
          git push origin HEAD:main
