name: One-shot tag v1.4

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-shot-tag-v1.4.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-tag-v1.4
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify merge commit is on main and create tag v1.4
        shell: bash
        env:
          EXPECTED_MAIN: ae4b5a1409a79dac9058b73d42d09544004f2373
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN" refs/remotes/origin/main || { echo "::error::$EXPECTED_MAIN is not an ancestor of main; refusing to tag"; exit 1; }
          if git ls-remote --exit-code origin "refs/tags/v1.4" >/dev/null 2>&1; then
            echo "::error::tag v1.4 already exists; refusing to move it"
            exit 1
          fi
          git tag -a v1.4 -m "Daymark v1.4 (versionCode 11, targetSdk 36)" "$EXPECTED_MAIN"
          git push origin "refs/tags/v1.4"

      - name: Remove this one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-tag-v1.4.yml
          git commit -m "Remove one-shot v1.4 tag workflow (already applied)"
          git push origin HEAD:main
