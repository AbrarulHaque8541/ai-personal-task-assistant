name: Diagnose PR 312 head check failures (one-shot v4)

# One-shot diagnostic v3: runs each host/source check separately against the
# exact PR #312 merge head and posts per-check exit codes plus failing output
# as a PR #312 comment, so results are readable without Actions log access.

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: oneshot-diagnose-pr312-head
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact PR 312 merge head
        uses: actions/checkout@v5
        with:
          ref: 25af26681310375e3ab46370326835d1a4dab884

      - name: Run each check with markers
        shell: bash
        run: |
          set +e
          {
            echo "### node $(node --version)"
            echo "### CHECK-START npm-test"
            npm test
            echo "### CHECK-EXIT npm-test:$?"
            cd android-app
            echo "### CHECK-START run-core-tests"
            sh ./tools/run-core-tests.sh
            echo "### CHECK-EXIT run-core-tests:$?"
            echo "### CHECK-START run-updater-picker-routing-tests"
            sh ./tools/run-updater-picker-routing-tests.sh
            echo "### CHECK-EXIT run-updater-picker-routing-tests:$?"
            echo "### CHECK-START run-attachment-tests"
            sh ./tools/run-attachment-tests.sh
            echo "### CHECK-EXIT run-attachment-tests:$?"
            echo "### CHECK-START run-storage-recovery-tests"
            sh ./tools/run-storage-recovery-tests.sh
            echo "### CHECK-EXIT run-storage-recovery-tests:$?"
            echo "### CHECK-START run-portable-backup-tests"
            sh ./tools/run-portable-backup-tests.sh
            echo "### CHECK-EXIT run-portable-backup-tests:$?"
            echo "### CHECK-START check-v1-source"
            sh ./tools/check-v1-source.sh
            echo "### CHECK-EXIT check-v1-source:$?"
            echo "### CHECK-START check-accessibility-contrast"
            python3 ./tools/check-accessibility-contrast.py
            echo "### CHECK-EXIT check-accessibility-contrast:$?"
            echo "### CHECK-START check-attachment-source"
            python3 ./tools/check-attachment-source.py "$PWD"
            echo "### CHECK-EXIT check-attachment-source:$?"
            echo "### CHECK-START check-backup-rules"
            python3 ./tools/check-backup-rules.py
            echo "### CHECK-EXIT check-backup-rules:$?"
            echo "### CHECK-START check-portable-archive-bounds"
            python3 ./tools/check-portable-archive-bounds.py
            echo "### CHECK-EXIT check-portable-archive-bounds:$?"
            echo "### CHECK-START check-schema-v1-fixture"
            python3 ./tools/check-schema-v1-fixture.py "$PWD"
            echo "### CHECK-EXIT check-schema-v1-fixture:$?"
            echo "### CHECK-START check-storage-failure-ui"
            python3 ./tools/check-storage-failure-ui.py
            echo "### CHECK-EXIT check-storage-failure-ui:$?"
            echo "### CHECK-START check-task-template-source"
            python3 ./tools/check-task-template-source.py "$PWD"
            echo "### CHECK-EXIT check-task-template-source:$?"
            echo "### ALL-DONE"
          } > /tmp/diag.log 2>&1
          tail -n 120 /tmp/diag.log

      - name: Post diagnostics report as PR comment
        shell: bash
        env:
          DIAG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          nl = chr(10)
          fence = chr(96) * 3
          log = open('/tmp/diag.log', encoding='utf-8', errors='replace').read()
          lines = log.split(nl)
          exits = {}
          sections = {}
          cur_name = None
          cur_lines = []
          for line in lines:
              m = re.match(r'### CHECK-START ([^ ]+)', line)
              if m:
                  cur_name = m.group(1)
                  cur_lines = []
                  continue
              m = re.match(r'### CHECK-EXIT ([^ :]+):([0-9]+)', line)
              if m:
                  exits[m.group(1)] = int(m.group(2))
                  sections[m.group(1)] = cur_lines
                  cur_name = None
                  cur_lines = []
                  continue
              if cur_name is not None:
                  cur_lines.append(line)

          failing = [name for name, code in exits.items() if code != 0]
          report = []
          report.append('## Automated diagnostics: PR #312 merge head 25af26681310375e3ab46370326835d1a4dab884')
          report.append('')
          report.append('Per-check exit codes:')
          for name in exits:
              report.append('- %s: exit %d' % (name, exits[name]))
          report.append('')
          if not exits:
              report.append('PARSE-ERROR: no CHECK-EXIT markers were captured; see raw tail below.')
              tail = nl.join(lines[-150:])
              report.append(fence)
              report.append(tail)
              report.append(fence)
          elif not failing:
              report.append('ALL CHECKS PASSED.')
          for name in failing:
              body = nl.join(sections.get(name, []))
              if len(body) > 11000:
                  body = body[:5500] + nl + '...[snip]...' + nl + body[-4500:]
              report.append('### Failing check: %s' % name)
              report.append('')
              report.append(fence)
              report.append(body)
              report.append(fence)
              report.append('')
          text = nl.join(report)
          if len(text) > 60000:
              text = text[:60000]
          token = os.environ['DIAG_TOKEN']
          req = urllib.request.Request(
              'https://api.github.com/repos/AbrarulHaque8541/daymark/issues/312/comments',
              data=json.dumps({'body': text}).encode('utf-8'),
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'daymark-ci-diagnostics',
              },
              method='POST')
          with urllib.request.urlopen(req) as resp:
              print('comment status', resp.status)
          print('POSTED-OK')
          PY
