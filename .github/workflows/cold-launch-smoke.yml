name: Cold-launch smoke test (v1.0 source)

on:
  push:
    branches: [test/cold-launch-smoke-v1]
    paths: ['.github/workflows/cold-launch-smoke.yml']

permissions:
  contents: write

jobs:
  cold-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;35.0.0'

      - name: Build sideload APK
        run: ./gradlew --no-daemon --console=plain assembleGithubSideloadDebug
      - name: Locate APK
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/smoke
          find "${{ github.workspace }}" -name "*.apk" -type f -not -path "*/.git/*" | tee /tmp/smoke-apk-list.txt
          APK_PATH="$(find "${{ github.workspace }}" -name "*.apk" -type f -not -path "*/.git/*" | head -n1)"
          echo "Found APK: $APK_PATH"
          echo "$APK_PATH" > /tmp/smoke-apk-path.txt
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Cold-launch on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_LEVEL: 34
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: >-
            APK="$(cat /tmp/smoke-apk-path.txt 2>/dev/null || true)"; echo "APK=$APK" > /tmp/smoke/apk.txt 2>&1; [ -n "$APK" ] && adb install -r "$APK" > /tmp/smoke/install.txt 2>&1 || true; adb shell am start -W -n com.abrar.daymark/.MainActivity > /tmp/smoke/am_start.txt 2>&1 || true; sleep 25; adb shell pidof com.abrar.daymark > /tmp/smoke/pid.txt 2>&1 || true; adb logcat -d > /tmp/smoke/logcat.txt 2>&1 || true; exit 0
      - name: Write and commit smoke result
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          mkdir -p smoke
          {
            echo "# Cold-launch smoke result (API 34, githubSideloadDebug)"
            echo
            echo "- Run: ${{ github.run_id }}"
            echo "- Head: ${{ github.sha }}"
            echo
            if [ ! -f /tmp/smoke/am_start.txt ]; then echo "(emulator script did not reach launch — likely boot failure)"; fi
            echo "## Chosen APK"
            echo '~~~'
            cat /tmp/smoke/apk.txt 2>/dev/null || echo "(missing)"
            echo '~~~'
            echo
            echo "## All APK files"
            echo '~~~'
            cat /tmp/smoke-apk-list.txt 2>/dev/null || echo "(missing)"
            echo '~~~'
            echo "## Install"
            echo '~~~'
            cat /tmp/smoke/install.txt 2>/dev/null || echo "(missing)"
            echo '~~~'
            echo
            echo "## am start -W"
            echo '~~~'
            cat /tmp/smoke/am_start.txt 2>/dev/null || echo "(missing)"
            echo '~~~'
            echo
            echo "## Process alive after 25s"
            echo '~~~'
            cat /tmp/smoke/pid.txt 2>/dev/null || echo "(no pid)"
            echo '~~~'
            echo
            if grep -q 'FATAL EXCEPTION' /tmp/smoke/logcat.txt 2>/dev/null; then
              echo "## Verdict: CRASH ON COLD LAUNCH"
              echo
              echo "## FATAL EXCEPTION excerpt"
              echo '~~~'
              grep -B2 -A60 'FATAL EXCEPTION' /tmp/smoke/logcat.txt | head -n 200
              echo '~~~'
              echo
              echo "## AndroidRuntime lines"
              echo '~~~'
              grep 'AndroidRuntime' /tmp/smoke/logcat.txt | head -n 120
              echo '~~~'
            else
              echo "## Verdict: LAUNCH SURVIVED (no FATAL EXCEPTION in logcat)"
            fi
          } > smoke/result-api34.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smoke/result-api34.md
          git commit -m "test: record cold-launch smoke result (API 34)" -m "Work by: Vibe | Model: GLM (glm-5-latest-short) | Tooling: GitHub MCP tools | Timestamp (UTC): ${{ env.TS }}" || true
          git push origin HEAD:test/cold-launch-smoke-v1
        env:
          TS: '2026-10-15T19:09:29.293Z'
