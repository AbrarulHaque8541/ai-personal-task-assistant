name: One-shot move v1.4 tag and dispatch production draft

# Temporary workflow: moves tag v1.4 to this commit and dispatches the
# production draft workflow on it. Tags pushed with GITHUB_TOKEN cannot
# trigger workflows themselves (recursion protection), so the production
# workflow is dispatched explicitly. This revision also fixes a literal
# carriage-return byte in android-production-release.yml that made the
# workflow file unparseable ("Invalid workflow file"), which is why the
# previous dispatch attempt failed.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-retag-dispatch-v1.4.yml'

permissions:
  contents: read

concurrency:
  group: one-shot-retag-dispatch-v1.4
  cancel-in-progress: false

jobs:
  retag-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move v1.4 tag to this commit and dispatch the production draft workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.4"
          existing="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}' || true)"
          if [[ -n "$existing" && "$existing" == "$GITHUB_SHA" ]]; then
            echo "Tag $tag already points at $GITHUB_SHA; skipping retag."
          else
            # Safety: never move the tag if any release (even a draft) already references it.
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > /dev/null 2>&1; then
              echo "::error::A release (possibly draft) already exists for $tag; refusing to move the tag."
              exit 1
            fi
            if [[ -n "$existing" ]]; then
              echo "Deleting stale tag $tag at $existing (no release was ever attached to it)."
              git push origin ":refs/tags/$tag"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # fetch-depth: 0 also fetches the OLD v1.4 tag, so plain `git tag`
            # would fail with "tag already exists". Force-move the local tag.
            git tag -f "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            # Confirm the remote tag landed on this commit before dispatching.
            remote_sha="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
            [[ "$remote_sha" == "$GITHUB_SHA" ]] || { echo "::error::Tag $tag did not land on $GITHUB_SHA (got ${remote_sha:-none})"; exit 1; }
          fi
          echo "Tag $tag is at $GITHUB_SHA; dispatching android-production-release.yml on $tag"
          gh workflow run android-production-release.yml --ref "$tag"

      - name: Remove one-shot workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main refs/remotes/origin/main
          git rm -f .github/workflows/one-shot-retag-dispatch-v1.4.yml
          git commit -m "ci: remove one-shot v1.4 retag/dispatch workflow"
          git push origin refs/heads/main
