name: Web CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run web prototype tests
      run: npm test
