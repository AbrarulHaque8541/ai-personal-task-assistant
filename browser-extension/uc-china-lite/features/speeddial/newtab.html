<!DOCTYPE html>
<!-- Speed Dial new-tab override. Kept fully offline: no CDNs, no fetches. -->
<html>
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
           justify-content:center; font:16px sans-serif; background:#202124; color:#e8eaed;
           color-scheme: dark; }
    #grid { display:grid; grid-template-columns:repeat(4, 96px); gap:20px; margin-top:28px; }
    a.tile { display:flex; flex-direction:column; align-items:center; gap:8px; color:#e8eaed;
             text-decoration:none; font-size:12px; }
    a.tile span.circle { width:52px; height:52px; border-radius:50%; background:#3c4043;
                         display:flex; align-items:center; justify-content:center; font-size:20px; }
    a.tile:hover span.circle { background:#484b4f; }
    #off { display:none; margin-top:12px; color:#9aa0a6; font-size:13px; text-align:center; }
    #off button { margin-top:10px; padding:8px 14px; border:0; border-radius:6px;
                  background:#8ab4f8; color:#202124; font:14px sans-serif; cursor:pointer; }
  </style>
</head>
<body>
  <div id="clock" style="font-size:56px;font-weight:200"></div>
  <div id="grid"></div>
  <div id="off">Speed Dial is off.
    <br><button id="enable">Turn on Speed Dial</button>
  </div>
  <script type="module">
    const DEFAULT_LINKS = [
      ["Google", "https://www.google.com", "G"],
      ["DuckDuckGo", "https://duckduckgo.com", "D"],
      ["YouTube", "https://www.youtube.com", "Y"],
      ["Wikipedia", "https://wikipedia.org", "W"],
      ["Gmail", "https://mail.google.com", "M"],
      ["Maps", "https://maps.google.com", "M"],
      ["Perplexity", "https://www.perplexity.ai", "P"],
      ["ChatGPT", "https://chatgpt.com", "C"],
    ];
    const clock = document.getElementById("clock");
    const tick = () => { clock.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
    tick(); setInterval(tick, 15000);

    const stored = await chrome.storage.sync.get(["settings"]);
    const enabled = stored.settings?.features?.speeddial;
    if (!enabled) {
      document.getElementById("grid").style.display = "none";
      document.getElementById("off").style.display = "block";
      document.getElementById("enable").onclick = async () => {
        const s = stored.settings || { features: {} };
        s.features = s.features || {};
        s.features.speeddial = true;
        await chrome.storage.sync.set({ settings: s });
        location.reload();
      };
    } else {
      const grid = document.getElementById("grid");
      const links = stored.settings?.speeddialLinks || DEFAULT_LINKS;
      for (const [name, url, letter] of links) {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = url;
        const circle = document.createElement("span");
        circle.className = "circle";
        circle.textContent = letter || name[0];
        const label = document.createElement("span");
        label.textContent = name;
        a.appendChild(circle); a.appendChild(label);
        grid.appendChild(a);
      }
    }
  </script>
</body>
</html>
